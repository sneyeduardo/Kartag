<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Pits - KARTAG</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/monitor.css">
</head>
<body>

    <header class="header-monitor">
        <h1>Centro de Control</h1>
    </header>

    <div class="monitor-grid">
        
        <!-- CUADRO 1: Pilotos Salientes (Última Carrera) -->
        <div class="panel-card panel-salientes">
            <div class="panel-header">
                <h2><i class="fas fa-flag-checkered"></i> Última Carrera</h2>
                <span class="badge badge-gray">Finalizada</span>
            </div>
            <ul class="lista-pilotos" id="lista-salientes">
                <!-- Se llenará con JavaScript -->
                <li class="loading">Cargando pilotos...</li>
            </ul>
        </div>

        <!-- CUADRO 2: Pilotos en Pista (Carrera Actual) -->
        <div class="panel-card panel-pista">
            <div class="panel-header">
                <h2><i class="fas fa-car-side"></i> En Pista</h2>
                <span class="badge badge-red">En Curso</span>
            </div>
            <ul class="lista-pilotos" id="lista-actual">
                <li class="loading">Cargando pilotos...</li>
            </ul>
        </div>

        <!-- CUADRO 3: Pilotos Registrándose (Próxima Carrera) -->
        <div class="panel-card panel-proximos">
            <div class="panel-header">
                <h2><i class="fas fa-stopwatch"></i> Próxima Carrera</h2>
                <span class="badge badge-green">Registrando</span>
            </div>
            <ul class="lista-pilotos" id="lista-proximos">
                <li class="loading">Cargando pilotos...</li>
            </ul>
        </div>

        <!-- CUADRO 4: Tablero LED (Expandible) -->
        <div class="panel-card panel-tablero" id="contenedor-tablero">
            <div class="panel-header">
                <h2><i class="fas fa-tv"></i> Tablero LED Telemetría</h2>
                <button class="btn-expandir" onclick="togglePantallaCompleta()" title="Ampliar Tablero">
                    <i class="fas fa-expand" id="icono-expandir"></i>
                </button>
            </div>
            <!-- Aquí cargamos tu tablero actual -->
            <iframe src="tablero.html" id="iframe-tablero" frameborder="0"></iframe>
        </div>

    </div>

    <script src="js/monitor.js"></script>
</body>
</html>
