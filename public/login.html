<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Telemetría Karting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles2.css">
</head>
<body>

    <!-- Navbar idéntico al index.html para dar contexto de aplicación -->


    <div class="login-wrapper">
        <div class="glass-container">
            
            <img src="assets/img/logo.png" width="400" height="100" alt="Kartag RC">
            <p class="subtitle">Acceso Administracion</p>
            
            <form action="/dashboard" method="POST">
                
                <!-- Campo Usuario -->
                <div class="form-group">
                    <label for="username">Piloto / Usuario</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user icon-left"></i>
                        <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autocomplete="off">
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock icon-left"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- Opciones (Recordarme y Olvidé contraseña) -->
                <div class="options-group">
                    <label>
                        <input type="checkbox" name="remember"> Recordarme
                    </label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón de Enviar -->
                <button type="submit" class="submit-btn">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <!-- Script para mostrar/ocultar la contraseña -->
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eye-icon");
            
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
