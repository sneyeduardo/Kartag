<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Karting Telemetry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles2.css">
</head>
<body>

    <!-- Navbar identical to index.html to provide application context -->

    <div class="login-wrapper">
        <div class="glass-container">
            
            <img src="assets/img/logo.png" width="400" height="100" alt="Kartag RC">
            <p class="subtitle">Administration Access</p>
            
            <form action="/dashboard" method="POST">
                
                <!-- Username Field -->
                <div class="form-group">
                    <label for="username">User</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user icon-left"></i>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="off">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock icon-left"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- Options (Remember me and Forgot password) -->
                <div class="options-group">
                    <label>
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#">Forgot your password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Log In</button>
            </form>
        </div>
    </div>

    <!-- Script to show/hide the password -->
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eye-icon");
            
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
