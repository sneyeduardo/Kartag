<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Pilotos - KARTAG</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="css/styleclientes.css">
</head>
<body>
    <div class="registro-container">
        <img class="imagen" src="assets/img/logo.png" width="400" height="100" alt="Kartag RC">
        <h2>Registro de Piloto</h2>
        <div class="step-indicator" id="step-title">Paso 1: Identificación</div>
        
        <form id="form-cliente">
            <div id="seccion-1" class="seccion activa">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="tipoDocumento">Tipo de Documento</label>
                        <select id="tipoDocumento" required>
                            <option value="cedula">Cédula de Identidad</option>
                            <option value="pasaporte">Pasaporte</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="numeroDocumento">Número de Documento</label>
                        <input type="text" id="numeroDocumento" placeholder="Ej. 12345678" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="fechaNacimiento">Fecha de Nacimiento</label>
                        <input type="date" id="fechaNacimiento" required>
                    </div>
                    
                    <div class="btn-acciones">
                        <button type="button" class="btn-primary" onclick="procesarPaso1()">Continuar <span style="margin-left:5px;">&#10140;</span></button>
                    </div>
                </div>
            </div>

            <!-- ==============================
                 SECCIÓN 2: Datos Personales
                 ============================== -->
            <div id="seccion-2" class="seccion">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" required>
                    </div>
                    <div class="form-group">
                        <label for="alias">Alias (Nickname)</label>
                        <input type="text" id="alias" required>
                    </div>
                    <div class="form-group">
                        <label for="sexo">Sexo</label>
                        <select id="sexo" required>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pais">País</label>
                        <input type="text" id="pais" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" required>
                    </div>
                    
                    <div class="btn-acciones">
                        <button type="button" class="btn-secondary" onclick="volverPaso1()">&#11013; Atrás</button>
                        <button type="button" class="btn-primary" id="btn-siguiente-2" onclick="procesarPaso2()">Continuar <span style="margin-left:5px;">&#10140;</span></button>
                    </div>
                </div>
            </div>

            <div id="seccion-3" class="seccion">
                <div class="camera-box">
                    <label style="color: #000000; font-weight: bold;">Fotografía de Perfil / Pits</label>
                    
                    <!-- Vista de la cámara web en vivo -->
                    <video id="video-webcam" autoplay playsinline></video>
                    <!-- Imagen estática resultante de la captura -->
                    <img id="foto-capturada" alt="Foto capturada">
                    <!-- Canvas oculto para procesar el frame de la foto -->
                    <canvas id="canvas-foto" style="display:none;"></canvas>

                    <button type="button" class="btn-camara" id="btn-tomar-foto" onclick="tomarFoto()">📸 Tomar Fotografía</button>

                    <div class="btn-acciones" style="width: 100%;">
                        <button type="button" class="btn-secondary" onclick="volverPaso2()">&#11013; Atrás</button>
                        <button type="button" class="btn-primary" id="btn-submit" onclick="finalizarRegistro()" disabled>Finalizar y Reiniciar</button>
                    </div>
                </div>
            </div>

        </form>
        
        
        <!-- Notificaciones visuales -->
        <div id="mensaje-sistema" class="mensaje-alerta"></div>
        
        <!-- Contador de Pilotos -->
    <script>
        let clienteIdActual = null; 
        let streamWebcam = null;
        let imagenBase64 = null;

        function mostrarMensaje(texto, tipo) {
            const msj = document.getElementById('mensaje-sistema');
            msj.innerText = texto;
            msj.className = `mensaje-alerta alerta-${tipo}`;
            msj.style.display = 'block';
            setTimeout(() => { msj.style.display = 'none'; }, 4000);
        }

        document.getElementById('tipoDocumento').addEventListener('change', function() {
            const inputNumero = document.getElementById('numeroDocumento');
            if (this.value === 'cedula') {
                inputNumero.placeholder = "Ej. 12345678";
            } else {
                inputNumero.placeholder = "Ej. P1234567";
            }
        });

        async function procesarPaso1() {
            const email = document.getElementById('email').value;
            const tipoDoc = document.getElementById('tipoDocumento').value;
            const numDoc = document.getElementById('numeroDocumento').value;
            const fechaNacimiento = document.getElementById('fechaNacimiento').value;

            if(!email || !numDoc || !fechaNacimiento) {
                mostrarMensaje("Por favor, completa todos los campos del Paso 1.", "error");
                return;
            }

            const btnContinuar = document.querySelector('#seccion-1 .btn-primary');
            btnContinuar.disabled = true;
            btnContinuar.innerText = "Guardando...";

            let valCedula = tipoDoc === 'cedula' ? numDoc : null;
            let valPasaporte = tipoDoc === 'pasaporte' ? numDoc : null;

            try {
                const resp = await fetch('/api/registro-paso1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, cedula: valCedula, pasaporte: valPasaporte, fechaNacimiento })
                });

                const result = await resp.json();

                if (result.status === 'success') {
                    clienteIdActual = result.clienteId; 
                    
                    document.getElementById('seccion-1').classList.remove('activa');
                    document.getElementById('seccion-2').classList.add('activa');
                    document.getElementById('step-title').innerText = "Paso 2: Datos Personales";
                } else {
                    mostrarMensaje("Error BD: " + result.mensaje, "error");
                }
            } catch (error) {
                mostrarMensaje("Fallo de conexión con el servidor en el Paso 1.", "error");
            } finally {
                btnContinuar.disabled = false;
                btnContinuar.innerHTML = 'Continuar <span style="margin-left:5px;">&#10140;</span>';
            }
        }

        function volverPaso1() {
            document.getElementById('seccion-2').classList.remove('activa');
            document.getElementById('seccion-1').classList.add('activa');
            document.getElementById('step-title').innerText = "Paso 1: Identificación";
        }

        // ==========================================
        // PASO 2: Actualizar con Datos Personales
        // ==========================================
        async function procesarPaso2() {
            if (!clienteIdActual) {
                mostrarMensaje("Error de secuencia: Falta el ID del piloto del Paso 1.", "error");
                return;
            }

            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const alias = document.getElementById('alias').value;
            const sexo = document.getElementById('sexo').value;
            const pais = document.getElementById('pais').value;
            const telefono = document.getElementById('telefono').value;

            if(!nombre || !apellido || !alias || !pais || !telefono) {
                mostrarMensaje("Por favor completa los campos obligatorios del Paso 2.", "error");
                return;
            }

            const btnSiguiente = document.getElementById('btn-siguiente-2');
            btnSiguiente.disabled = true;
            btnSiguiente.innerText = "Guardando...";

            try {
                const resp = await fetch('/api/registro-paso2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        clienteId: clienteIdActual,
                        nombre, apellido, alias, sexo, pais, telefono
                    })
                });

                const result = await resp.json();

                if (result.status === 'success') {
                    // Pasar a la Sección 3 (Cámara)
                    document.getElementById('seccion-2').classList.remove('activa');
                    document.getElementById('seccion-3').classList.add('activa');
                    document.getElementById('step-title').innerText = "Paso 3: Fotografía del Piloto";
                    
                    iniciarWebcam();
                } else {
                    mostrarMensaje("Error BD: " + result.mensaje, "error");
                }
            } catch (error) {
                mostrarMensaje("Fallo de conexión con el servidor en el Paso 2.", "error");
            } finally {
                btnSiguiente.disabled = false;
                btnSiguiente.innerHTML = 'Continuar <span style="margin-left:5px;">&#10140;</span>';
            }
        }

        function volverPaso2() {
            detenerWebcam();
            document.getElementById('seccion-3').classList.remove('activa');
            document.getElementById('seccion-2').classList.add('activa');
            document.getElementById('step-title').innerText = "Paso 2: Datos Personales";
        }

        // ==========================================
        // PASO 3: Gestión de la Cámara y Finalizar
        // ==========================================
        async function iniciarWebcam() {
            try {
                streamWebcam = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                const videoElement = document.getElementById('video-webcam');
                videoElement.srcObject = streamWebcam;
                videoElement.style.display = 'block';
                document.getElementById('foto-capturada').style.display = 'none';
                document.getElementById('btn-tomar-foto').innerText = "📸 Tomar Fotografía";
                document.getElementById('btn-submit').disabled = true;
            } catch (err) {
                mostrarMensaje("No se pudo acceder a la cámara web. Verifica los permisos.", "error");
            }
        }

        function detenerWebcam() {
            if (streamWebcam) {
                streamWebcam.getTracks().forEach(track => track.stop());
            }
        }

        function tomarFoto() {
            const video = document.getElementById('video-webcam');
            const canvas = document.getElementById('canvas-foto');
            const foto = document.getElementById('foto-capturada');
            const btnTomar = document.getElementById('btn-tomar-foto');

            if (video.style.display !== 'none') {
                // Capturar frame del video al canvas
                canvas.width = video.videoWidth || 400;
                canvas.height = video.videoHeight || 300;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Convertir a formato Base64 para enviarlo al servidor
                imagenBase64 = canvas.toDataURL('image/png');
                foto.src = imagenBase64;

                // Alternar visualización
                video.style.display = 'none';
                foto.style.display = 'block';
                btnTomar.innerText = "🔄 Repetir Foto";
                document.getElementById('btn-submit').disabled = false; // Habilitar finalizar
            } else {
                // Reiniciar cámara si desea tomar otra foto
                video.style.display = 'block';
                foto.style.display = 'none';
                btnTomar.innerText = "📸 Tomar Fotografía";
                document.getElementById('btn-submit').disabled = true;
            }
        }

        async function finalizarRegistro() {
            if (!clienteIdActual || !imagenBase64) {
                mostrarMensaje("Falta la imagen o el ID del piloto.", "error");
                return;
            }

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Guardando Foto...";

            try {
                
                const resp = await fetch('/api/registro-paso3-foto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        clienteId: clienteIdActual,
                        foto: imagenBase64
                    })
                });

                const result = await resp.json();

                if (result.status === 'success') {
                    mostrarMensaje("¡Registro completo! Reiniciando sistema...", "success");
                    detenerWebcam();

                    
                    setTimeout(() => {
                        document.getElementById('form-cliente').reset();
                        clienteIdActual = null;
                        imagenBase64 = null;
                        
                        // Volver a la sección 1
                        document.getElementById('seccion-3').classList.remove('activa');
                        document.getElementById('seccion-1').classList.add('activa');
                        document.getElementById('step-title').innerText = "Paso 1: Identificación";
                    }, 2000);

                } else {
                    mostrarMensaje("Error al guardar foto: " + result.mensaje, "error");
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Finalizar y Reiniciar";
                }
            } catch (error) {
                mostrarMensaje("Fallo de conexión al enviar la fotografía.", "error");
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Finalizar y Reiniciar";
            }
        }
    </script>
</body>
</html>
