                    <div class="form-group full-width">

    <script>
        let partnerIdActual = null; 

        function mostrarMensaje(texto, tipo) {
            const msj = document.getElementById('mensaje-sistema');
            msj.innerText = texto;
            msj.className = `mensaje-alerta alerta-${tipo}`;
            msj.style.display = 'block';
            setTimeout(() => { msj.style.display = 'none'; }, 4000);
        }

        // STEP 1: Company Details (CORREGIDO)
        async function procesarPaso1() {
            const companyName = document.getElementById('companyName').value.trim();
            const email = document.getElementById('email').value.trim();

            // 1. Verificación de campos vacíos
            if(!companyName || !email) {
                mostrarMensaje("Please complete all fields.", "error");
                return;
            }

            // 2. Verificación estricta de Correo Electrónico (Debe tener @ y un dominio)
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                mostrarMensaje("Please enter a valid email address (e.g. contact@company.com).", "error");
                return;
            }

            const btnContinuar = document.querySelector('#seccion-1 .btn-primary');
            btnContinuar.disabled = true;
            btnContinuar.innerText = "Processing...";

            try {
                // Ya no enviamos taxIdType ni taxIdNumber
                const resp = await fetch('/api/registro-afiliado-paso1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ companyName, email })
                });

                const result = await resp.json();

                if (result.status === 'success') {
                    partnerIdActual = result.partnerId; 
                    
                    document.getElementById('seccion-1').classList.remove('activa');
                    document.getElementById('seccion-2').classList.add('activa');
                    document.getElementById('step-title').innerText = "Step 2: Contact Person";
                } else {
                    mostrarMensaje("DB Error: " + result.mensaje, "error");
                }
            } catch (error) {
                mostrarMensaje("Server connection failed in Step 1.", "error");
            } finally {
                btnContinuar.disabled = false;
                btnContinuar.innerHTML = 'Continue <span style="margin-left:5px;">&#10140;</span>';
            }
        }

        function volverPaso1() {
            document.getElementById('seccion-2').classList.remove('activa');
            document.getElementById('seccion-1').classList.add('activa');
            document.getElementById('step-title').innerText = "Step 1: Company Details";
        }

        // STEP 2: Contact Person & FINALIZATION
        async function procesarPaso2() {
            if (!partnerIdActual) {
                mostrarMensaje("Sequence error: Missing partner ID from Step 1.", "error");
                return;
            }

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const country = document.getElementById('country').value.trim();
            const phone = document.getElementById('phone').value.trim();

            // 1. Verificación de campos vacíos (se quitó partnerType porque lo eliminaste del HTML en este paso)
            if(!firstName || !lastName || !country || !phone) {
                mostrarMensaje("Please complete all contact fields.", "error");
                return;
            }

            // 2. Verificación de Teléfono
            const phoneDigitsOnly = phone.replace(/\D/g, '');
            if (phoneDigitsOnly.length < 7) {
                mostrarMensaje("Please enter a valid phone number (at least 7 digits).", "error");
                return;
            }

            const btnSubmit = document.getElementById('btn-siguiente-2');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Sending Application...";

            try {
                const resp = await fetch('/api/registro-afiliado-paso2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        partnerId: partnerIdActual,
                        firstName, lastName, country, phone
                    })
                });

                const result = await resp.json();

                if (result.status === 'success') {
                    mostrarMensaje("Thank you very much! Your application has been submitted successfully.", "success");

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);

                } else {
                    mostrarMensaje("DB Error: " + result.mensaje, "error");
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Submit Application";
                }
            } catch (error) {
                mostrarMensaje("Server connection failed in Step 2.", "error");
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Submit Application";
            }
        }
    </script>
